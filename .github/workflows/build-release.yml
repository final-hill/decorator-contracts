# Reference: <https://help.github.com/en/actions/language-and-framework-guides/using-nodejs-with-github-actions>
name: Build/Release

on:
  release:
    types: [created]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [26.x]

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run unit tests
        run: npm test
      - name: Create package
        run: npm pack
      - name: Rename package to generic name
        run: mv *.tgz final-hill-decorator-contracts.tgz
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: final-hill-decorator-contracts.tgz

  release:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest

    # Trusted publishing authenticates with a short-lived OIDC token instead of a
    # stored secret. `id-token: write` is what allows the runner to request one;
    # without it npm authenticates as nobody and the registry answers a publish
    # attempt with 404 rather than a permission error.
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        node-version: [26.x]
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: artifact
      - name: Extract package from artifact
        run: tar -xf final-hill-decorator-contracts.tgz --strip 1
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org
          # Never cache in a release build: the publish must reflect exactly
          # what `npm ci` resolves for this commit.
          package-manager-cache: false
      - name: Publish
        # No NODE_AUTH_TOKEN: the npm CLI detects the OIDC environment and
        # exchanges it for a short-lived publish token. Provenance attestations
        # are generated automatically for a public package from a public
        # repository.
        run: npm publish --access public
